name: Native app builds
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**', 'shared/**', 'android/**', 'ios/**', 'native/**', 'package*.json', 'capacitor.config.json', 'vite.config.js', 'scripts/build-native.js', '.github/workflows/native.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Churp-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
  ios-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run native:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath /tmp/churp-ios-build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: Churp-iPhone-simulator
          path: /tmp/churp-ios-build/Build/Products/Debug-iphonesimulator/*.app
